<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Queen Chess</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
</head>
<body>

<!-- Animated Background -->
<div class="background-effects" id="bgEffects">
    <div class="queen-silhouette-bg">♛</div>
    <div class="purple-glow-bg purple-glow-bg-1"></div>
    <div class="purple-glow-bg purple-glow-bg-2"></div>
</div>

<div class="sidebar" id="sidebar"></div>
<div id="content">
    <h2>Welcome Queen 👑</h2>
</div>

<!-- Confetti Container -->
<div class="confetti-container" id="confettiContainer"></div>

<!-- Libraries -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chess-openings@1.0.6/dist/chess-openings.min.js"></script>

<script>
let analysisBoard = null;
let analysisGame = null;
let analysisMoves = [];
let currentMoveIndex = -1;

// ================= BACKGROUND PARTICLES =================
function initBackgroundParticles() {
    const container = document.getElementById('bgEffects');
    for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 20 + 's';
        p.style.animationDuration = (16 + Math.random() * 12) + 's';
        container.appendChild(p);
    }
}
initBackgroundParticles();

// ================= GLOBAL =================
let engine = null;
let board = null;
let game = new Chess();
let playerColor = "white";
let aiLevel = "intermediate";
const aiSettings = {
    beginner:{skill:0,depth:1},
    intermediate:{skill:5,depth:3},
    advanced:{skill:10,depth:6},
    master:{skill:20,depth:14}
};
let currentAccuracy = 0;
let currentOpening = "Unknown Opening";
let moveReviews = [];
let gameMoves = [];
let pendingAIMove = false;
let pendingLiveAnalysis = false;
let pendingReviewAnalysis = false;
let moveAnalysis = [];
let engineBusy = false;
let gameStartTime = null;
let currentGameId = null;
let gameTimerInterval = null;
let hintsEnabled = false;

function goToLogin() { window.location.href = "login.html"; }

// ================= ENGINE =================
function initEngine() {
    if(engine) return;
    engine = new Worker("stockfish.js");
    engine.postMessage("uci");
    engine.postMessage("isready");
    engine.addEventListener("message", function(event){
        const line = event.data;
        if(pendingLiveAnalysis && line.includes("score cp")){
            const m = line.match(/score cp (-?\d+)/);
            if(m){
                const s = parseInt(m[1]);
                let r = "Good Move";
                if(s > 250) r = "🔥 Brilliant";
                else if(s > 120) r = "✨ Great Move";
                else if(s < -250) r = "❌ Blunder";
                else if(s < -100) r = "⚠ Mistake";
                const el = document.getElementById("liveReview");
                if(el) el.innerHTML = r;
                pendingLiveAnalysis = false;
            }
        }
        if(pendingReviewAnalysis && line.includes("score cp")){
            const m = line.match(/score cp (-?\d+)/);
            if(!m) return;
            const s = parseInt(m[1]);
            let t = "Best Move", c = "#22c55e";
            if(s < -300){ t = "Blunder"; c = "#ef4444"; }
            else if(s < -120){ t = "Mistake"; c = "#f97316"; }
            else if(s > 250){ t = "Brilliant"; c = "#06b6d4"; }
            else if(s > 120){ t = "Great Move"; c = "#a855f7"; }
            document.getElementById("moveReview").innerHTML =
                `<div class="move-review-box"><h4>Move ${currentMoveIndex + 1}</h4><div class="eval" style="color:${c}">${t}</div><div class="quality">Move: ${analysisMoves[currentMoveIndex]} | Eval: ${(s/100).toFixed(2)}</div></div>`;
            pendingReviewAnalysis = false;
        }
        if(line.includes("bestmove")){ engineBusy = false; }
        if(pendingAIMove && line.startsWith("bestmove")){
            const move = line.split(" ")[1];
            if(move === "(none)" || move.length < 4) return;
            game.move({from:move.substring(0,2),to:move.substring(2,4),promotion:"q"});
            board.position(game.fen());
            checkGameStatus();
            pendingAIMove = false;
        }
    });
}

// ================= AI =================
function makeAIMove() {
    if(!engine || game.game_over()) return;
    pendingAIMove = true;
    const l = aiSettings[aiLevel];
    engine.postMessage("position fen "+game.fen());
    engine.postMessage("setoption name Skill Level value "+l.skill);
    engine.postMessage("go depth "+l.depth);
}

// ================= GAME =================
function toggleHints() {
    hintsEnabled = !hintsEnabled;
    document.querySelectorAll('.toggle-track').forEach(t => t.classList.toggle('active', hintsEnabled));
    const c = document.getElementById("beginnerCoach");
    if(c) c.innerHTML = hintsEnabled ? "💡 Beginner Coach Active" : "Hints OFF";
}

function updateBeginnerCoach(move){
    const c = document.getElementById("beginnerCoach");
    if(!c) return;
    if(move.piece === "p") c.innerHTML = "💡 Good pawn move. Control the center.";
    else if(move.piece === "n") c.innerHTML = "✨ Nice! Knights are strong early.";
    else if(move.piece === "q") c.innerHTML = "⚠ Be careful using the queen too early.";
    else c.innerHTML = "♟ Keep developing your pieces.";
}

function onDrop(source, target) {
    if(pendingAIMove) return "snapback";
    const piece = game.get(source);
    if(!piece || piece.color !== playerColor[0] || game.turn() !== playerColor[0]) return "snapback";
    const move = game.move({from:source,to:target,promotion:"q"});
    if(move === null) return "snapback";
    gameMoves.push({move:move.san,playerEval:0,bestEval:0});
    board.position(game.fen());
    updateBeginnerCoach(move);
    currentAccuracy = Math.floor(70 + Math.random() * 30);
    const pgn = game.pgn();
    if(pgn.includes("e4 e5 Nf3 Nc6 Bb5")) currentOpening = "Ruy Lopez";
    engine.postMessage("position fen "+game.fen());
    pendingLiveAnalysis = true;
    engine.postMessage("go depth 12");
    checkGameStatus();
    updateMoveCount();
    if(!game.game_over()) setTimeout(() => makeAIMove(), 300);
}

// ================= GAME STATUS =================
function checkGameStatus() {
    const el = document.getElementById("gameStatusValue");
    if(game.in_checkmate()){
        const w = game.turn() === "w" ? "Black" : "White";
        if(el) el.innerHTML = "🏆 "+w+" wins!";
        board.draggable = false;
        setTimeout(() => saveGame(w), 500);
    } else if(game.in_draw()){
        if(el) el.innerHTML = "🤝 Draw!";
        board.draggable = false;
        setTimeout(() => saveGame("draw"), 500);
    } else if(el){
        const t = game.turn() === "w" ? "White" : "Black";
        el.innerHTML = t+"'s Turn";
    }
}

// ================= SAVE GAME =================
function saveGame(result) {
    const token = localStorage.getItem("token");
    if(!token){ showGameOverModal(result,"Unknown","Unknown",0); return; }
    fetch("https://queen-chess.onrender.com/api/game/save",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
        body:JSON.stringify({result,moves:game.history(),pgn:game.pgn(),playerColor,accuracy:currentAccuracy,opening:currentOpening})
    }).then(r=>{if(!r.ok)throw Error("Save failed");return r.json()})
    .then(d=>{
        currentGameId = d.game?._id || d._id || null;
        let dur = "0m 0s";
        if(gameStartTime){const e=Math.floor((Date.now()-gameStartTime)/1000);dur=Math.floor(e/60)+"m "+e%60+"s";}
        showGameOverModal(result,game.history().length,currentAccuracy,dur);
    }).catch(()=>showGameOverModal(result,game.history().length,currentAccuracy,"0m 0s"));
}

// ================= GAME OVER MODAL =================
function showGameOverModal(result,moveCount,accuracy,duration){
    const isDraw = result === "draw";
    let wN, lN;
    if(isDraw){wN="Draw";lN="Draw";}
    else if(result==="White"){wN=playerColor==="white"?"You":"AI";lN=playerColor==="white"?"AI":"You";}
    else{wN=playerColor==="black"?"You":"AI";lN=playerColor==="black"?"AI":"You";}
    const old = document.querySelector('.modal-overlay');
    if(old) old.remove();
    const ov = document.createElement('div'); ov.className = 'modal-overlay';
    ov.innerHTML = `<div class="game-over-modal"><div class="trophy-glow"></div><div class="modal-trophy">${isDraw?"🤝":"🏆"}</div><div class="modal-title">${isDraw?"Game Drawn":"Game Over"}</div><div class="modal-subtitle">${isDraw?"A hard-fought battle!":result+" wins!"}</div><div class="modal-players"><div class="modal-player"><div class="icon">${playerColor==="white"?"🤍":"🖤"}</div><div class="player-label">You</div><div class="player-name">Player (${playerColor})</div></div><div class="modal-vs">VS</div><div class="modal-player"><div class="icon">🤖</div><div class="player-label">AI</div><div class="player-name">Queen Chess AI</div></div></div><div class="modal-results-grid"><div class="modal-result-item"><div class="label">🏆 Winner</div><div class="value ${!isDraw&&wN==='You'?'winner':''}">${isDraw?"—":wN}</div></div><div class="modal-result-item"><div class="label">❌ Loser</div><div class="value ${!isDraw&&lN==='You'?'loser':''}">${isDraw?"—":lN}</div></div><div class="modal-result-item"><div class="label">♟ Moves</div><div class="value">${moveCount}</div></div><div class="modal-result-item"><div class="label">🎯 Accuracy</div><div class="value">${accuracy}%</div></div><div class="modal-result-item"><div class="label">⏱ Duration</div><div class="value">${duration}</div></div><div class="modal-result-item"><div class="label">📋 Result</div><div class="value ${!isDraw&&wN==='You'?'winner':''}">${isDraw?"Draw":result}</div></div></div><div class="modal-actions"><button class="view-analysis-btn" onclick="viewGameAnalysis()">📊 View Analysis</button><button class="play-again-btn" onclick="playAgain()">🔄 Play Again</button></div></div>`;
    document.body.appendChild(ov);
    launchConfetti();
}

function launchConfetti(){
    const c = document.getElementById('confettiContainer'); c.innerHTML = '';
    const colors = ['#a855f7','#7c3aed','#c084fc','#9333ea','#fbbf24','#22c55e','#06b6d4','#ef4444'];
    const shapes = ['●','■','▲','★','♦'];
    for(let i=0;i<40;i++){
        const p = document.createElement('div'); p.className = 'confetti-piece';
        p.textContent = shapes[Math.floor(Math.random()*shapes.length)];
        p.style.left = Math.random()*100+'%'; p.style.color = colors[Math.floor(Math.random()*colors.length)];
        p.style.fontSize = (6+Math.random()*10)+'px'; p.style.animationDuration = (2+Math.random()*2)+'s';
        p.style.animationDelay = Math.random()*0.4+'s'; c.appendChild(p);
    }
    setTimeout(()=>{c.innerHTML='';},5000);
}

function viewGameAnalysis(){
    const o = document.querySelector('.modal-overlay'); if(o) o.remove();
    if(currentGameId){if(gameTimerInterval)clearInterval(gameTimerInterval);window.location.href="index.html?analyze="+currentGameId;}
    else{alert("Game ID not available.");loadMatches();}
}

function playAgain(){
    const o = document.querySelector('.modal-overlay'); if(o) o.remove();
    game = new Chess(); currentGameId = null; loadPlay();
}

// ================= SIDEBAR =================
function renderSidebar(){
    const t = localStorage.getItem("token");
    document.getElementById("sidebar").innerHTML =
        `<div class="logo">♛ <span>Queen</span> Chess</div><div class="sidebar-buttons">`+
        (t?`<button onclick="logout()">🚪 Logout</button>`:`<button onclick="goToLogin()">🔑 Login</button>`)+
        `<button onclick="loadHome()">🏠 Home</button><button onclick="loadPlay()">♟ Play</button><button onclick="loadMatches()">📁 My Games</button><button onclick="loadLearning()">📚 Learning</button><button onclick="loadQuiz()">🧩 Quiz</button><button onclick="loadProfile()">👤 Profile</button><button onclick="loadPremium()">💎 Premium</button></div>`;
}

function logout(){localStorage.removeItem("token");location.reload();}

// ================= HOME =================
async function loadHome(){
    const t = localStorage.getItem("token");
    try{
        const r = await fetch("https://queen-chess.onrender.com/api/game/stats/rapid",{headers:{Authorization:"Bearer "+t}});
        const d = await r.json();
        document.getElementById("content").innerHTML =
            `<div class="home-page"><div class="topbar"><div><h1>Welcome Back 👑</h1><p>Continue improving your chess skills.</p></div></div><div class="stats-grid"><div class="stat-box"><h3>Games</h3><span>${d.gamesPlayed}</span></div><div class="stat-box"><h3>Win Rate</h3><span>${d.winRate}</span></div><div class="stat-box"><h3>Rating</h3><span>${d.rating}</span></div><div class="stat-box"><h3>Rank</h3><span>${d.tier}</span></div></div><div class="dashboard-grid"><div class="dashboard-card"><h2>♟ Continue Playing</h2><p>Jump into a new AI match and improve.</p><button onclick="loadPlay()">Start Match</button></div><div class="dashboard-card"><h2>📚 Learning</h2><p>Study openings, tactics, and endgames.</p><button onclick="loadLearning()">Open Learning</button></div></div></div>`;
    }catch(e){
        document.getElementById("content").innerHTML = '<div class="dashboard-card"><h1>⚠ Failed To Load Stats</h1><p>Please try again later.</p></div>';
    }
}

function loadLearning(){document.getElementById("content").innerHTML='<div class="analysis-card"><h2>📚 Learning</h2><p class="sub-text">Coming soon...</p></div>';}
function loadQuiz(){document.getElementById("content").innerHTML='<div class="analysis-card"><h2>🧩 Quiz</h2><p class="sub-text">Chess puzzles and tactical training.</p></div>';}
function loadProfile(){document.getElementById("content").innerHTML='<div class="analysis-card"><h2>👤 Profile</h2><p class="sub-text">Player statistics and achievements.</p></div>';}
function loadPremium(){document.getElementById("content").innerHTML='<div class="analysis-card"><h2>💎 Premium</h2><p class="sub-text">This is trial version; you will be notified before service is activated.</p></div>';}

// ================= PLAY =================
let selectedColor = null;

function setColor(color){
    playerColor = color; selectedColor = color;
    document.querySelectorAll('.color-row button').forEach(b=>b.classList.remove('selected'));
    const btns = document.querySelectorAll('.color-row button');
    if(color==='white'&&btns[0]) btns[0].classList.add('selected');
    if(color==='black'&&btns[1]) btns[1].classList.add('selected');
    const el = document.getElementById("gameResult");
    if(el){el.innerHTML="Selected: "+color;el.style.display='block';}
}

function setRandomColor(){
    const r = Math.random()<0.5?"white":"black";
    playerColor = r; selectedColor = r;
    document.querySelectorAll('.color-row button').forEach(b=>b.classList.remove('selected'));
    const el = document.getElementById("gameResult");
    if(el){el.innerHTML="🎲 Random selected: "+r;el.style.display='block';}
}

function startGame(){
    const sc = document.querySelector('.start-card');
    if(sc) sc.classList.add('fade-out');
    gameStartTime = Date.now();
    pendingAIMove = false; engineBusy = false; gameMoves = []; currentAccuracy = 0; currentOpening = "Unknown Opening";
    aiLevel = document.getElementById("difficultySelect").value;
    game = new Chess();
    setTimeout(()=>{
        showGameLayout();
        board = Chessboard('board',{draggable:true,position:"start",orientation:playerColor,onDrop:onDrop,onMouseoverSquare:showHints,onMouseoutSquare:removeHints});
        initEngine();
        if(playerColor==="black") setTimeout(()=>makeAIMove(),500);
    },400);
}

function showGameLayout(){
    const hintsActive = hintsEnabled ? 'active' : '';
    document.getElementById("content").innerHTML =
        `<div class="game-layout"><div class="game-left"><div id="board" class="fade-in"></div><div class="game-controls-bar"><button onclick="undoMove()">↩ Undo</button><button onclick="getHint()">💡 Hint</button><button onclick="resignGame()">🏳 Resign</button><div class="toggle-switch" onclick="toggleHints()"><div class="toggle-track ${hintsActive}"><div class="toggle-thumb"></div></div>Show Legal Moves</div></div><div id="liveReview" class="live-review"><div id="beginnerCoach" class="coach-box">💡 Beginner Coach Ready</div>AI Analysis Waiting...</div></div><div class="game-right"><div class="game-info-panel"><div class="panel-header"><h3>Game Info</h3></div><div class="game-info-row-item"><span class="label">🤍 White Timer</span><span class="value timer" id="whiteTimer">00:00</span></div><div class="game-info-row-item"><span class="label">🖤 Black Timer</span><span class="value timer" id="blackTimer">00:00</span></div><div class="game-info-row-item"><span class="label">🎯 Difficulty</span><span class="value">${aiLevel.charAt(0).toUpperCase()+aiLevel.slice(1)}</span></div><div class="game-info-row-item"><span class="label">♟ Moves</span><span class="value" id="moveCount">0</span></div><div class="game-info-row-item"><span class="label">📊 Status</span><span class="status-badge" id="gameStatusValue">${playerColor}'s Turn</span></div><div class="game-info-row-item"><span class="label">⚔ Captured</span><span class="captured" id="capturedPieces">—</span></div></div></div></div>`;
    startGameTimer();
}

function startGameTimer(){
    if(gameTimerInterval) clearInterval(gameTimerInterval);
    const st = Date.now();
    gameTimerInterval = setInterval(()=>{
        const e = Math.floor((Date.now()-st)/1000);
        const ts = String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0');
        const wt = document.getElementById('whiteTimer'), bt = document.getElementById('blackTimer');
        if(wt) wt.textContent = ts; if(bt) bt.textContent = ts;
    },1000);
}

function toggleInGameHints(){ toggleHints(); }

function undoMove(){
    if(game.history().length>=2){game.undo();game.undo();board.position(game.fen());}
    else if(game.history().length===1){game.undo();board.position(game.fen());}
    updateMoveCount();
}

function getHint(){
    if(!engine) return;
    engine.postMessage("stop");
    setTimeout(()=>{
        engine.postMessage("position fen "+game.fen());
        engine.postMessage("go depth 10");
        const c = document.getElementById('beginnerCoach');
        if(c) c.innerHTML = "💡 Analyzing best move...";
        const h = function(e){
            const l = e.data;
            if(l.startsWith("bestmove")){
                const m = l.split(" ")[1];
                if(m&&m.length>=4){const c2=document.getElementById('beginnerCoach');if(c2)c2.innerHTML="💡 Hint: Try "+m.substring(0,2)+" → "+m.substring(2,4);}
                engine.removeEventListener("message",h);
            }
        };
        engine.addEventListener("message",h);
    },100);
}

function resignGame(){
    if(game.game_over()) return;
    if(confirm("Are you sure you want to resign?")){
        const w = playerColor==="white"?"Black":"White";
        board.draggable = false;
        const el = document.getElementById("gameStatusValue");
        if(el) el.innerHTML = "🏳 "+w+" wins (resignation)";
        game = new Chess(); saveGame(w);
    }
}

function updateMoveCount(){
    const el = document.getElementById('moveCount');
    if(el) el.textContent = game.history().length;
}

function showHints(square){
    if(!hintsEnabled) return;
    game.moves({square,verbose:true}).forEach(m=>{
        const el = document.querySelector(`.square-${m.to}`);
        if(el) el.style.boxShadow = "inset 0 0 0 4px #a855f7";
    });
}

function removeHints(){
    document.querySelectorAll('[class*="square-"]').forEach(el=>el.style.boxShadow="");
}

function loadPlay(){
    if(gameTimerInterval) clearInterval(gameTimerInterval);
    gameTimerInterval = null; gameStartTime = null;
    const sw = selectedColor==='white'?'selected':'', sb = selectedColor==='black'?'selected':'';
    document.getElementById("content").innerHTML =
        `<div class="start-screen-wrapper"><div class="start-card"><span class="start-card-icon">♛</span><h2>Start a New Match</h2><p class="sub-text">Choose your preferences and start playing.</p><div class="color-row"><button class="${sw}" onclick="setColor('white')">🤍 White</button><button class="${sb}" onclick="setColor('black')">🖤 Black</button><button class="full-btn" onclick="setRandomColor()" style="min-width:90px;padding:9px 12px;margin:0">🎲 Random</button></div><div><p class="difficulty-label">AI Difficulty</p><select id="difficultySelect"><option value="beginner">Beginner</option><option value="intermediate" selected>Intermediate</option><option value="advanced">Advanced</option><option value="master">Master</option></select></div><div class="toggle-switch" onclick="toggleHints()"><div class="toggle-track"><div class="toggle-thumb"></div></div>Show Legal Moves</div><button class="start-btn" onclick="startGame()">▶ Start Match</button><p class="footer-text">Play against our AI and improve your skills.</p><div id="gameResult"></div></div></div>`;
}

// ================= MY GAMES =================
function loadMatches(){
    const t = localStorage.getItem("token");
    if(!t){document.getElementById("content").innerHTML='<div class="analysis-card"><h2>⚠️ Login Required</h2><button onclick="goToLogin()">Login</button></div>';return;}
    fetch("https://queen-chess.onrender.com/api/game/my-games",{headers:{"Authorization":"Bearer "+t}})
    .then(r=>r.json()).then(d=>{
        if(!d||d.length===0){document.getElementById("content").innerHTML='<div class="analysis-card"><h2>No Games Yet 😢</h2><p style="color:#aaa;">Play your first match to see history.</p></div>';return;}
        let h = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;"><div><h2>♟ My Games</h2><p style="color:#999;">Recent matches and analysis</p></div></div><div class="games-container">`;
        d.forEach(g=>{h+=`<div class="game-card"><div class="game-header"><div class="result">${g.result||"Unknown"}</div><div class="date">${new Date(g.createdAt).toLocaleDateString()}</div></div><div class="game-body">♟ Moves: ${g.moves?.length||0}<br><br>🎯 Accuracy: ${g.accuracy||0}%</div><div class="game-actions"><button onclick="analyzeGame('${g._id}')">🔍 Analyze</button></div></div>`;});
        h+=`</div>`; document.getElementById("content").innerHTML = h;
    });
}

// ================= ANALYSIS =================
async function analyzeGame(gameId){
    const t = localStorage.getItem("token");
    const r = await fetch("https://queen-chess.onrender.com/api/game/my-games",{headers:{"Authorization":"Bearer "+t}});
    const games = await r.json();
    const g = games.find(x=>x._id===gameId);
    if(!g){alert("Game not found");return;}
    document.getElementById("content").innerHTML =
        `<div class="analysis-layout"><div class="analysis-left"><div class="game-summary-card"><h3>Game Summary</h3><div class="summary-stat"><span class="label">🎯 Accuracy</span><span class="value">${g.accuracy||0}%</span></div><div class="summary-stat"><span class="label">♟ Moves</span><span class="value">${g.moves?.length||0}</span></div><div class="summary-stat"><span class="label">🏆 Result</span><span class="value">${g.result||"Unknown"}</span></div><div class="summary-stat"><span class="label">📖 Opening</span><span class="value">${g.opening||"Unknown"}</span></div><div id="moveReview" class="move-review-box"><h4 style="color:#aaa;">Current Move</h4><p style="color:#666;font-size:11px;">Click Next to begin</p></div></div><button class="back-btn-sm" onclick="loadMatches()" style="margin-top:4px;">← Back to Games</button></div><div class="analysis-center"><div id="analysisBoard"></div><div class="move-center-buttons"><button onclick="previousMove()">← Previous</button><button onclick="playAnalysisMove()">▶ Play</button><button onclick="nextMove()">Next →</button></div></div><div class="analysis-right"><div class="moves-list-panel"><h4>Game Moves</h4><div id="movesList"></div></div></div></div>`;
    analysisGame = new Chess();
    if(!engine) initEngine();
    analysisMoves = g.moves || [];
    renderMovesList();
    currentMoveIndex = -1;
    analysisBoard = Chessboard("analysisBoard",{position:"start",draggable:false,orientation:g.playerColor==="black"?"black":"white"});
    if(g.playerColor==="black") analysisBoard.orientation("black");
}

function nextMove(){
    if(currentMoveIndex>=analysisMoves.length-1) return;
    currentMoveIndex++;
    analysisGame.move(analysisMoves[currentMoveIndex]);
    analysisBoard.position(analysisGame.fen());
    renderMovesList();
    analyzeCurrentMove();
}

function previousMove(){
    if(currentMoveIndex<0) return;
    analysisGame.undo();
    analysisBoard.position(analysisGame.fen());
    currentMoveIndex--;
    renderMovesList();
    analyzeCurrentMove();
}

function playAnalysisMove(){
    if(currentMoveIndex>=analysisMoves.length-1) return;
    // Play through all remaining moves automatically
    const playNext = () => {
        if(currentMoveIndex>=analysisMoves.length-1) return;
        currentMoveIndex++;
        analysisGame.move(analysisMoves[currentMoveIndex]);
        analysisBoard.position(analysisGame.fen());
        renderMovesList();
        analyzeCurrentMove();
        setTimeout(playNext, 600);
    };
    playNext();
}

function analyzeCurrentMove(){
    if(currentMoveIndex<0||!engine||engineBusy) return;
    engineBusy = true;
    engine.postMessage("stop");
    setTimeout(()=>{
        engine.postMessage("position fen "+analysisGame.fen());
        pendingReviewAnalysis = true;
        engine.postMessage("go depth 12");
    },100);
}

function renderMovesList(){
    let h = "";
    analysisMoves.forEach((m,i)=>{
        const a = i===currentMoveIndex?"active-move":"";
        h+=`<button class="move-btn ${a}" onclick="jumpToMove(${i})">${i+1}. ${m}</button>`;
    });
    document.getElementById("movesList").innerHTML = h;
}

function jumpToMove(index){
    analysisGame = new Chess();
    for(let i=0;i<=index;i++) analysisGame.move(analysisMoves[i]);
    currentMoveIndex = index;
    analysisBoard.position(analysisGame.fen());
    renderMovesList();
    analyzeCurrentMove();
}

// ================= URL PARAMS =================
function checkUrlParams(){
    const p = new URLSearchParams(window.location.search);
    const id = p.get('analyze');
    if(id){
        window.history.replaceState({},'',window.location.pathname);
        setTimeout(()=>analyzeGame(id),100);
        return true;
    }
    return false;
}

// ================= INIT =================
renderSidebar();
if(!checkUrlParams()) loadHome();
</script>
