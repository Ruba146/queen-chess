<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Queen Chess</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
</head>
<body>

<!-- Animated Background -->
<div class="background-effects" id="bgEffects">
    <div class="queen-silhouette-bg">♛</div>
    <div class="purple-glow-bg purple-glow-bg-1"></div>
    <div class="purple-glow-bg purple-glow-bg-2"></div>
</div>

<div class="sidebar" id="sidebar"></div>
<div id="content">
    <h2>Welcome Queen 👑</h2>
</div>

<!-- Confetti Container -->
<div class="confetti-container" id="confettiContainer"></div>

<!-- Libraries -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chess-openings@1.0.6/dist/chess-openings.min.js"></script>

<script>
let analysisBoard = null;
let analysisGame = null;
let analysisMoves = [];
let currentMoveIndex = -1;
let cachedProfile = null;

// ================= BACKGROUND PARTICLES =================
function initBackgroundParticles() {
    const container = document.getElementById('bgEffects');
    for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 20 + 's';
        p.style.animationDuration = (16 + Math.random() * 12) + 's';
        container.appendChild(p);
    }
}
initBackgroundParticles();

// ================= GLOBAL =================
let engine = null;
let board = null;
let game = new Chess();
let playerColor = "white";
let aiLevel = "intermediate";
const aiSettings = {
    beginner:{skill:0,depth:1},
    intermediate:{skill:5,depth:3},
    advanced:{skill:10,depth:6},
    master:{skill:20,depth:14}
};
let currentAccuracy = 0;
let currentOpening = "Unknown Opening";
let moveReviews = [];
let gameMoves = [];
let pendingAIMove = false;
let pendingLiveAnalysis = false;
let pendingReviewAnalysis = false;
let moveAnalysis = [];
let engineBusy = false;
let gameStartTime = null;
let currentGameId = null;
let gameTimerInterval = null;
let hintsEnabled = false;

const API_BASE = "https://queen-chess.onrender.com";

function goToLogin() { window.location.href = "login.html"; }

function getToken() { return localStorage.getItem("token"); }

async function apiFetch(path, options = {}) {
    const token = getToken();
    const headers = { ...options.headers };
    if (token) headers["Authorization"] = "Bearer " + token;
    if (!headers["Content-Type"] && options.body) headers["Content-Type"] = "application/json";
    const r = await fetch(API_BASE + path, { ...options, headers });
    if (!r.ok) throw new Error("API Error: " + r.status);
    return r.json();
}

// ================= ENGINE =================
function initEngine() {
    if(engine) return;
    engine = new Worker("stockfish.js");
    engine.postMessage("uci");
    engine.postMessage("isready");
    engine.addEventListener("message", function(event){
        const line = event.data;
        if(pendingLiveAnalysis && line.includes("score cp")){
            const m = line.match(/score cp (-?\d+)/);
            if(m){
                const s = parseInt(m[1]);
                let r = "Good Move";
                if(s > 250) r = "🔥 Brilliant";
                else if(s > 120) r = "✨ Great Move";
                else if(s < -250) r = "❌ Blunder";
                else if(s < -100) r = "⚠ Mistake";
                const el = document.getElementById("liveReview");
                if(el) el.innerHTML = r;
                pendingLiveAnalysis = false;
            }
        }
        if(pendingReviewAnalysis && line.includes("score cp")){
            const m = line.match(/score cp (-?\d+)/);
            if(!m) return;
            const s = parseInt(m[1]);
            let t = "Best Move", c = "#22c55e";
            if(s < -300){ t = "Blunder"; c = "#ef4444"; }
            else if(s < -120){ t = "Mistake"; c = "#f97316"; }
            else if(s > 250){ t = "Brilliant"; c = "#06b6d4"; }
            else if(s > 120){ t = "Great Move"; c = "#a855f7"; }
            document.getElementById("moveReview").innerHTML =
                `<div class="move-review-box"><h4>Move ${currentMoveIndex + 1}</h4><div class="eval" style="color:${c}">${t}</div><div class="quality">Move: ${analysisMoves[currentMoveIndex]} | Eval: ${(s/100).toFixed(2)}</div></div>`;
            pendingReviewAnalysis = false;
        }
        if(line.includes("bestmove")){ engineBusy = false; }
        if(pendingAIMove && line.startsWith("bestmove")){
            const move = line.split(" ")[1];
            if(move === "(none)" || move.length < 4) return;
            game.move({from:move.substring(0,2),to:move.substring(2,4),promotion:"q"});
            board.position(game.fen());
            checkGameStatus();
            pendingAIMove = false;
        }
    });
}

// ================= AI =================
function makeAIMove() {
    if(!engine || game.game_over()) return;
    pendingAIMove = true;
    const l = aiSettings[aiLevel];
    engine.postMessage("position fen "+game.fen());
    engine.postMessage("setoption name Skill Level value "+l.skill);
    engine.postMessage("go depth "+l.depth);
}

// ================= GAME =================
function toggleHints() {
    hintsEnabled = !hintsEnabled;
    document.querySelectorAll('.toggle-track').forEach(t => t.classList.toggle('active', hintsEnabled));
    const c = document.getElementById("beginnerCoach");
    if(c) c.innerHTML = hintsEnabled ? "💡 Beginner Coach Active" : "Hints OFF";
}

function updateBeginnerCoach(move){
    const c = document.getElementById("beginnerCoach");
    if(!c) return;
    if(move.piece === "p") c.innerHTML = "💡 Good pawn move. Control the center.";
    else if(move.piece === "n") c.innerHTML = "✨ Nice! Knights are strong early.";
    else if(move.piece === "q") c.innerHTML = "⚠ Be careful using the queen too early.";
    else c.innerHTML = "♟ Keep developing your pieces.";
}

function onDrop(source, target) {
    if(pendingAIMove) return "snapback";
    const piece = game.get(source);
    if(!piece || piece.color !== playerColor[0] || game.turn() !== playerColor[0]) return "snapback";
    const move = game.move({from:source,to:target,promotion:"q"});
    if(move === null) return "snapback";
    gameMoves.push({move:move.san,playerEval:0,bestEval:0});
    board.position(game.fen());
    updateBeginnerCoach(move);
    currentAccuracy = Math.floor(70 + Math.random() * 30);
    const pgn = game.pgn();
    if(pgn.includes("e4 e5 Nf3 Nc6 Bb5")) currentOpening = "Ruy Lopez";
    engine.postMessage("position fen "+game.fen());
    pendingLiveAnalysis = true;
    engine.postMessage("go depth 12");
    checkGameStatus();
    updateMoveCount();
    if(!game.game_over()) setTimeout(() => makeAIMove(), 300);
}

// ================= GAME STATUS =================
function checkGameStatus() {
    const el = document.getElementById("gameStatusValue");
    if(game.in_checkmate()){
        const w = game.turn() === "w" ? "Black" : "White";
        if(el) el.innerHTML = "🏆 "+w+" wins!";
        board.draggable = false;
        setTimeout(() => saveGame(w), 500);
    } else if(game.in_draw()){
        if(el) el.innerHTML = "🤝 Draw!";
        board.draggable = false;
        setTimeout(() => saveGame("draw"), 500);
    } else if(el){
        const t = game.turn() === "w" ? "White" : "Black";
        el.innerHTML = t+"'s Turn";
    }
}

// ================= SAVE GAME =================
async function saveGame(result) {
    const token = getToken();
    if(!token){ showGameOverModal(result,"Unknown","Unknown",0,{}); return; }
    
    let dur = "0m 0s", durationSec = 0;
    if(gameStartTime){
        durationSec = Math.floor((Date.now()-gameStartTime)/1000);
        dur = Math.floor(durationSec/60)+"m "+durationSec%60+"s";
    }
    
    try {
        const d = await apiFetch("/api/game/save", {
            method:"POST",
            body:JSON.stringify({
                result,
                moves:game.history(),
                pgn:game.pgn(),
                playerColor,
                accuracy:currentAccuracy,
                opening:currentOpening,
                difficulty:aiLevel,
                duration:durationSec
            })
        });
        currentGameId = d.game?._id || null;
        showGameOverModal(result, game.history().length, currentAccuracy, dur, d.analysis || {}, d.ratingChange || 0, d.newRating || 1200, d.rankAfterGame || "Beginner", d.playerLevelAfterGame || "Beginner");
    } catch(e) {
        showGameOverModal(result, game.history().length, currentAccuracy, dur, {});
    }
}

// ================= GAME OVER MODAL =================
function showGameOverModal(result, moveCount, accuracy, duration, analysis, ratingChange, newRating, rankAfter, playerLevel){
    const isDraw = result === "draw";
    let wN, lN;
    if(isDraw){wN="Draw";lN="Draw";}
    else if(result==="White"){wN=playerColor==="white"?"You":"AI";lN=playerColor==="white"?"AI":"You";}
    else{wN=playerColor==="black"?"You":"AI";lN=playerColor==="black"?"AI":"You";}
    
    const old = document.querySelector('.modal-overlay');
    if(old) old.remove();
    
    const rc = ratingChange !== undefined ? (ratingChange > 0 ? "+"+ratingChange : ratingChange) : "—";
    const nr = newRating || "—";
    const ra = rankAfter || "—";
    const pl = playerLevel || "—";
    
    const strengths = analysis && analysis.strengths ? analysis.strengths.slice(0,3).map(s => `<div class="strength-item">✓ ${s}</div>`).join("") : "";
    const weaknesses = analysis && analysis.weaknesses ? analysis.weaknesses.slice(0,3).map(w => `<div class="weakness-item">✗ ${w}</div>`).join("") : "";
    const os = analysis && analysis.openingScore ? "⭐".repeat(Math.round(analysis.openingScore/25)) : "—";
    const ms = analysis && analysis.middleGameScore ? "⭐".repeat(Math.round(analysis.middleGameScore/25)) : "—";
    const es = analysis && analysis.endgameScore ? "⭐".repeat(Math.round(analysis.endgameScore/25)) : "—";
    const perf = analysis && analysis.performanceScore ? analysis.performanceScore + "%" : "—";
    const coach = analysis && analysis.coachRecommendations ? analysis.coachRecommendations.slice(0,2).map(c => `<div class="coach-item">💡 ${c}</div>`).join("") : "";
    
    const ov = document.createElement('div'); ov.className = 'modal-overlay';
    ov.innerHTML = `<div class="game-over-modal"><div class="trophy-glow"></div><div class="modal-trophy">${isDraw?"🤝":"🏆"}</div><div class="modal-title">${isDraw?"Game Drawn":"Game Over"}</div><div class="modal-subtitle">${isDraw?"A hard-fought battle!":result+" wins!"}</div><div class="modal-players"><div class="modal-player"><div class="icon">${playerColor==="white"?"🤍":"🖤"}</div><div class="player-label">You</div></div><div class="modal-vs">VS</div><div class="modal-player"><div class="icon">🤖</div><div class="player-label">AI</div></div></div><div class="modal-results-grid"><div class="modal-result-item"><div class="label">🏆 Winner</div><div class="value ${!isDraw&&wN==='You'?'winner':''}">${isDraw?"—":wN}</div></div><div class="modal-result-item"><div class="label">❌ Loser</div><div class="value ${!isDraw&&lN==='You'?'loser':''}">${isDraw?"—":lN}</div></div><div class="modal-result-item"><div class="label">♟ Moves</div><div class="value">${moveCount}</div></div><div class="modal-result-item"><div class="label">🎯 Accuracy</div><div class="value">${accuracy}%</div></div><div class="modal-result-item"><div class="label">⏱ Duration</div><div class="value">${duration}</div></div><div class="modal-result-item"><div class="label">📊 Result</div><div class="value ${!isDraw&&wN==='You'?'winner':''}">${isDraw?"Draw":result}</div></div><div class="modal-result-item"><div class="label">📈 Rating Δ</div><div class="value" style="color:${ratingChange>0?'#22c55e':ratingChange<0?'#ef4444':'#aaa'}">${rc}</div></div><div class="modal-result-item"><div class="label">🏅 Rating</div><div class="value">${nr}</div></div><div class="modal-result-item"><div class="label">🎖 Rank</div><div class="value">${ra}</div></div><div class="modal-result-item"><div class="label">📊 Level</div><div class="value">${pl}</div></div><div class="modal-result-item"><div class="label">📋 Performance</div><div class="value">${perf}</div></div></div>${strengths ? `<div style="margin:8px 0"><div style="font-size:11px;color:#4ade80;margin-bottom:4px;font-weight:600;">💪 STRENGTHS</div>${strengths}</div>` : ""}${weaknesses ? `<div style="margin:8px 0"><div style="font-size:11px;color:#f87171;margin-bottom:4px;font-weight:600;">⚠ WEAKNESSES</div>${weaknesses}</div>` : ""}${analysis && analysis.openingScore ? `<div style="margin:8px 0;padding:10px;background:rgba(255,255,255,0.03);border-radius:12px;"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span>Opening: ${os}</span><span>Middle: ${ms}</span><span>Endgame: ${es}</span></div></div>` : ""}${coach ? `<div style="margin:8px 0"><div style="font-size:11px;color:#c084fc;margin-bottom:4px;font-weight:600;">🎯 COACH</div>${coach}</div>` : ""}<div class="modal-actions"><button class="view-analysis-btn" onclick="viewGameAnalysis()">📊 View Analysis</button><button class="play-again-btn" onclick="playAgain()">🔄 Play Again</button></div></div>`;
    document.body.appendChild(ov);
    launchConfetti();
}

function launchConfetti(){
    const c = document.getElementById('confettiContainer'); c.innerHTML = '';
    const colors = ['#a855f7','#7c3aed','#c084fc','#9333ea','#fbbf24','#22c55e','#06b6d4','#ef4444'];
    const shapes = ['●','■','▲','★','♦'];
    for(let i=0;i<40;i++){
        const p = document.createElement('div'); p.className = 'confetti-piece';
        p.textContent = shapes[Math.floor(Math.random()*shapes.length)];
        p.style.left = Math.random()*100+'%'; p.style.color = colors[Math.floor(Math.random()*colors.length)];
        p.style.fontSize = (6+Math.random()*10)+'px'; p.style.animationDuration = (2+Math.random()*2)+'s';
        p.style.animationDelay = Math.random()*0.4+'s'; c.appendChild(p);
    }
    setTimeout(()=>{c.innerHTML='';},5000);
}

function viewGameAnalysis(){
    const o = document.querySelector('.modal-overlay'); if(o) o.remove();
    if(currentGameId){if(gameTimerInterval)clearInterval(gameTimerInterval);window.location.href="index.html?analyze="+currentGameId;}
    else{alert("Game ID not available.");loadMatches();}
}

function playAgain(){
    const o = document.querySelector('.modal-overlay'); if(o) o.remove();
    game = new Chess(); currentGameId = null; loadPlay();
}

// ================= SIDEBAR =================
function renderSidebar(){
    const t = getToken();
    document.getElementById("sidebar").innerHTML =
        `<div class="logo">♛ <span>Queen</span> Chess</div><div class="sidebar-buttons">`+
        (t?`<button onclick="logout()">🚪 Logout</button>`:`<button onclick="goToLogin()">🔑 Login</button>`)+
        `<button onclick="loadHome()">🏠 Home</button><button onclick="loadPlay()">♟ Play</button><button onclick="loadMatches()">📁 My Games</button><button onclick="loadLearning()">📚 Learning</button><button onclick="loadQuiz()">🧩 Quiz</button><button onclick="loadProfile()">👤 Profile</button><button onclick="loadPremium()">💎 Premium</button></div>`;
}

function logout(){localStorage.removeItem("token");location.reload();}

// ================= GET DISPLAY NAME =================
async function getDisplayName() {
    if (cachedProfile) return cachedProfile.displayName || cachedProfile.username;
    try {
        const profile = await apiFetch("/api/auth/profile");
        cachedProfile = profile;
        return profile.displayName || profile.username;
    } catch(e) {
        return "Player";
    }
}

// ================= HOME =================
async function loadHome(){
    const t = getToken();
    if(!t) {
        document.getElementById("content").innerHTML = '<div class="analysis-card" style="margin:auto;"><h2>👑 Queen Chess</h2><p class="sub-text">Login to view your dashboard.</p><button onclick="goToLogin()">Login</button></div>';
        return;
    }
    try{
        const [stats, profile] = await Promise.all([
            apiFetch("/api/game/stats/rapid"),
            apiFetch("/api/auth/profile")
        ]);
        cachedProfile = profile;
        const name = profile.displayName || profile.username;
        
        document.getElementById("content").innerHTML =
            `<div class="home-page"><div class="topbar"><div><h1>Hello, ${name} 👑</h1><p>Continue improving your chess skills.</p></div></div><div class="stats-grid"><div class="stat-box"><h3>🎮 Total Games</h3><span>${stats.gamesPlayed}</span></div><div class="stat-box"><h3>📈 Win Rate</h3><span>${stats.winRate}</span></div><div class="stat-box"><h3>🏅 Rating</h3><span>${stats.rating}</span></div><div class="stat-box"><h3>🎖 Rank</h3><span><span class="rank-badge ${(stats.tier||"Beginner").toLowerCase()}">${stats.tier||"Beginner"}</span></span></div></div><div class="dashboard-grid"><div class="dashboard-card"><h2>♟ Continue Playing</h2><p>Jump into a new AI match and improve.</p><button onclick="loadPlay()">Start Match</button></div><div class="dashboard-card"><h2>📚 Learning</h2><p>Study openings, tactics, and endgames.</p><button onclick="loadLearning()">Open Learning</button></div></div></div>`;
    }catch(e){
        document.getElementById("content").innerHTML = '<div class="dashboard-card" style="margin:auto;"><h1>⚠ Failed To Load Stats</h1><p>Please try again later.</p></div>';
    }
}

function loadLearning(){document.getElementById("content").innerHTML='<div class="analysis-card" style="margin:auto;"><h2>📚 Learning</h2><p class="sub-text">Coming soon...</p></div>';}
function loadQuiz(){document.getElementById("content").innerHTML='<div class="analysis-card" style="margin:auto;"><h2>🧩 Quiz</h2><p class="sub-text">Chess puzzles and tactical training.</p></div>';}
function loadPremium(){document.getElementById("content").innerHTML='<div class="analysis-card" style="margin:auto;"><h2>💎 Premium</h2><p class="sub-text">This is trial version; you will be notified before service is activated.</p></div>';}

// ================= PROFILE =================
async function loadProfile(){
    const t = getToken();
    if(!t){document.getElementById("content").innerHTML='<div class="analysis-card" style="margin:auto;"><h2>⚠️ Login Required</h2><button onclick="goToLogin()">Login</button></div>';return;}
    
    try {
        const user = await apiFetch("/api/auth/profile");
        const stats = await apiFetch("/api/game/extended-stats/rapid");
        cachedProfile = user;
        
        const name = user.displayName || user.username;
        const initial = (user.displayName || user.username || "?").charAt(0).toUpperCase();
        const avatarHtml = user.profilePicture 
            ? `<img src="${user.profilePicture}" alt="Avatar">` 
            : initial;
        
        const joinDate = user.createdAt ? new Date(user.createdAt).toLocaleDateString() : "Unknown";
        const total = (user.stats?.rapid?.wins||0) + (user.stats?.rapid?.losses||0) + (user.stats?.rapid?.draws||0);
        const winRate = total > 0 ? ((user.stats?.rapid?.wins||0) / total * 100).toFixed(1) + "%" : "0%";
        
        let rank = "Beginner";
        const rating = user.ratings?.rapid || 1200;
        if (rating >= 800) rank = "Bronze";
        if (rating >= 1200) rank = "Silver";
        if (rating >= 1600) rank = "Gold";
        if (rating >= 2000) rank = "Platinum";
        if (rating >= 2400) rank = "Diamond";
        if (rating >= 2700) rank = "Master";
        if (rating >= 2900) rank = "Grandmaster";
        
        document.getElementById("content").innerHTML = `
        <div class="profile-page">
            <div class="profile-header">
                <div class="profile-avatar">${avatarHtml}</div>
                <div class="profile-info">
                    <h2>${name}</h2>
                    <div class="username-tag">@${user.username}</div>
                    <div class="member-since">Member since ${joinDate} • ${user.email}</div>
                    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
                        <span class="rank-badge ${rank.toLowerCase()}">🏅 ${rank}</span>
                        <span class="level-badge ${(user.playerLevel||"Beginner").toLowerCase()}">📊 ${user.playerLevel||"Beginner"}</span>
                    </div>
                </div>
            </div>
            
            <div class="profile-stats-grid">
                <div class="profile-stat-card">
                    <div class="stat-icon">🏅</div>
                    <div class="stat-label">Rating</div>
                    <div class="stat-value">${rating}</div>
                    <div class="stat-sub">${rank}</div>
                </div>
                <div class="profile-stat-card">
                    <div class="stat-icon">🎮</div>
                    <div class="stat-label">Total Games</div>
                    <div class="stat-value">${total}</div>
                    <div class="stat-sub">${user.stats?.rapid?.wins||0}W / ${user.stats?.rapid?.losses||0}L / ${user.stats?.rapid?.draws||0}D</div>
                </div>
                <div class="profile-stat-card">
                    <div class="stat-icon">📈</div>
                    <div class="stat-label">Win Rate</div>
                    <div class="stat-value">${winRate}</div>
                    <div class="stat-sub">${user.winStreak?.rapid||0} win streak</div>
                </div>
                <div class="profile-stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-label">Level</div>
                    <div class="stat-value">${user.playerLevel||"Beginner"}</div>
                    <div class="stat-sub">${stats.avgAccuracy||0}% avg accuracy</div>
                </div>
                <div class="profile-stat-card">
                    <div class="stat-icon">♟</div>
                    <div class="stat-label">Preferred Side</div>
                    <div class="stat-value">${(user.preferredSide||"random").charAt(0).toUpperCase()+(user.preferredSide||"random").slice(1)}</div>
                    <div class="stat-sub">Difficulty: ${(user.mostPlayedDifficulty||"intermediate").charAt(0).toUpperCase()+(user.mostPlayedDifficulty||"intermediate").slice(1)}</div>
                </div>
                <div class="profile-stat-card">
                    <div class="stat-icon">📖</div>
                    <div class="stat-label">Favorite Opening</div>
                    <div class="stat-value" style="font-size:16px;">${user.favoriteOpening||"Unknown"}</div>
                    <div class="stat-sub">Consistency: ${stats.consistency||50}%</div>
                </div>
            </div>
            
            <div class="profile-settings">
                <h3>⚙️ Account Settings</h3>
                <div class="settings-row">
                    <label>Display Name</label>
                    <input type="text" id="displayNameInput" value="${user.displayName||user.username}" placeholder="Display Name">
                    <button class="save-btn" onclick="updateDisplayName()">Save</button>
                </div>
                <div class="settings-row">
                    <label>Username</label>
                    <input type="text" id="usernameInput" value="${user.username}" placeholder="Username">
                    <button class="save-btn" onclick="updateUsername()">Save</button>
                </div>
                <div class="settings-row">
                    <label>Preferred Side</label>
                    <select id="preferredSideSelect">
                        <option value="random" ${(user.preferredSide||"random")==="random"?"selected":""}>Random</option>
                        <option value="white" ${user.preferredSide==="white"?"selected":""}>White</option>
                        <option value="black" ${user.preferredSide==="black"?"selected":""}>Black</option>
                    </select>
                    <button class="save-btn" onclick="updatePreferredSide()">Save</button>
                </div>
                <div class="settings-divider"></div>
                <div class="settings-row">
                    <label>Current Password</label>
                    <input type="password" id="currentPwd" placeholder="Current password">
                </div>
                <div class="settings-row">
                    <label>New Password</label>
                    <input type="password" id="newPwd" placeholder="New password">
                    <button class="save-btn" onclick="changePassword()">Change</button>
                </div>
                <div class="settings-row">
                    <label>Profile Picture URL</label>
                    <input type="text" id="profilePicInput" value="${user.profilePicture||""}" placeholder="Image URL">
                    <button class="save-btn" onclick="updateProfilePic()">Save</button>
                </div>
            </div>

function getHint(){
    if(!engine) return;
    engine.postMessage("stop");
    setTimeout(()=>{
        engine.postMessage("position fen "+game.fen());
        engine.postMessage("go depth 10");
        const c = document.getElementById('beginnerCoach');
        if(c) c.innerHTML = "💡 Analyzing best move...";
        const h = function(e){
            const l = e.data;
            if(l.startsWith("bestmove")){
                const m = l.split(" ")[1];
                if(m&&m.length>=4){const c2=document.getElementById('beginnerCoach');if(c2)c2.innerHTML="💡 Hint: Try "+m.substring(0,2)+" → "+m.substring(2,4);}
                engine.removeEventListener("message",h);
            }
        };
        engine.addEventListener("message",h);
    },100);
}

function drawEvalGraph(evalData) {
    const canvas = document.getElementById('evalCanvas');
    if (!canvas || !evalData || evalData.length < 2) return;
    
    const ctx = canvas.getContext('2d');
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width - 30;
    canvas.height = rect.height - 30;
    
    const w = canvas.width;
    const h = canvas.height;
    const padding = 30;
    
    ctx.clearRect(0, 0, w, h);
    
    // Find min/max
    let maxVal = Math.max(...evalData.map(d => Math.max(Math.abs(d.bestEval), Math.abs(d.playerEval), 100)));
    maxVal = Math.max(maxVal, 100);
    
    const scale = (h - padding * 2) / (maxVal * 2);
    const midY = padding + (h - padding * 2) / 2;
    
    // Draw zero line
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padding, midY);
    ctx.lineTo(w - padding, midY);
    ctx.stroke();
    
    if (evalData.length < 2) return;
    
    const step = (w - padding * 2) / (evalData.length - 1);
    
    // Draw best eval line
    ctx.strokeStyle = '#22c55e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    evalData.forEach((d, i) => {
        const x = padding + i * step;
        const y = midY - (d.bestEval / maxVal) * (h - padding * 2) / 2;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });
    ctx.stroke();
    
    // Draw player eval line
    ctx.strokeStyle = '#a855f7';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 3]);
    ctx.beginPath();
    evalData.forEach((d, i) => {
        const x = padding + i * step;
        const y = midY - (d.playerEval / maxVal) * (h - padding * 2) / 2;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.setLineDash([]);
    
    // Draw labels
    ctx.fillStyle = '#666';
    ctx.font = '10px Inter';
    ctx.textAlign = 'center';
    ctx.fillText('0', padding - 10, midY + 3);
    ctx.fillText('+' + maxVal, padding - 10, padding + 10);
    ctx.fillText('-' + maxVal, padding - 10, h - padding + 3);
}

function nextMove(){
    if(currentMoveIndex>=analysisMoves.length-1) return;
    currentMoveIndex++;
    analysisGame.move(analysisMoves[currentMoveIndex]);
    analysisBoard.position(analysisGame.fen());
    renderMovesList();
    analyzeCurrentMove();
}

function previousMove(){
    if(currentMoveIndex<0) return;
    analysisGame.undo();
    analysisBoard.position(analysisGame.fen());
    currentMoveIndex--;
    renderMovesList();
    analyzeCurrentMove();
}

function playAnalysisMove(){
    if(currentMoveIndex>=analysisMoves.length-1) return;
    const playNext = () => {
        if(currentMoveIndex>=analysisMoves.length-1) return;
        currentMoveIndex++;
        analysisGame.move(analysisMoves[currentMoveIndex]);
        analysisBoard.position(analysisGame.fen());
        renderMovesList();
        analyzeCurrentMove();
        setTimeout(playNext, 600);
    };
    playNext();
}

function analyzeCurrentMove(){
    if(currentMoveIndex<0||!engine||engineBusy) return;
    engineBusy = true;
    engine.postMessage("stop");
    setTimeout(()=>{
        engine.postMessage("position fen "+analysisGame.fen());
        pendingReviewAnalysis = true;
        engine.postMessage("go depth 12");
    },100);
}

    let h = "";
    analysisMoves.forEach((m,i)=>{
        const a = i===currentMoveIndex?"active-move":"";
        h+=`<button class="move-btn ${a}" onclick="jumpToMove(${i})">${i+1}. ${m}</button>`;
    });

}

function jumpToMove(index){
    analysisGame = new Chess();
    for(let i=0;i<=index;i++) analysisGame.move(analysisMoves[i]);
    currentMoveIndex = index;
    analysisBoard.position(analysisGame.fen());
    renderMovesList();
    analyzeCurrentMove();
}

// ================= URL PARAMS =================
function checkUrlParams(){
    const p = new URLSearchParams(window.location.search);
    const id = p.get('analyze');
    if(id){
        window.history.replaceState({},'',window.location.pathname);
        setTimeout(()=>analyzeGame(id),100);
        return true;
    }
    return false;
}

// ================= INIT =================
renderSidebar();
if(!checkUrlParams()) loadHome();
