<html lang="en">

href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

</head>

<body>

<!-- Animated Background Effects -->
<div class="background-effects" id="bgEffects">
    <div class="queen-silhouette queen-silhouette-1">♛</div>
    <div class="queen-silhouette queen-silhouette-2">♛</div>
    <div class="queen-silhouette queen-silhouette-3">♛</div>
    <div class="purple-glow purple-glow-1"></div>
    <div class="purple-glow purple-glow-2"></div>
</div>

<div class="sidebar" id="sidebar"></div>
<div id="content">
    <h2>Welcome Queen 👑</h2>
</div>

<!-- Confetti Container -->
<div class="confetti-container" id="confettiContainer"></div>

<!-- Libraries -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chess-openings@1.0.6/dist/chess-openings.min.js"></script>

<script>
let analysisBoard = null;
let analysisGame = null;
let analysisMoves = [];
let currentMoveIndex = -1;

// ================= BACKGROUND PARTICLES =================
function initBackgroundParticles() {
    const container = document.getElementById('bgEffects');
    for (let i = 0; i < 15; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 18 + 's';
        particle.style.animationDuration = (14 + Math.random() * 10) + 's';
        particle.style.width = (2 + Math.random() * 3) + 'px';
        particle.style.height = particle.style.width;
        container.appendChild(particle);
    }
}
initBackgroundParticles();

// ================= GLOBAL =================
let engine = null;
let board = null;
let game = new Chess();
let playerColor = "white";
let aiLevel = "intermediate";
const aiSettings = {

    beginner:{
        skill:0,
        depth:1
    },

    intermediate:{
        skill:5,
        depth:3
    },

    advanced:{
        skill:10,
        depth:6
    },

    master:{
        skill:20,
        depth:14
    }
};
let currentAccuracy = 0;
let currentOpening = "Unknown Opening";

let moveReviews = [];
let gameMoves = [];
let pendingAIMove = false;
let pendingLiveAnalysis = false;
let pendingReviewAnalysis = false;
let moveAnalysis = [];
let engineBusy = false;
let gameStartTime = null;
let currentGameId = null;
let gameTimerInterval = null;

function goToLogin() {
  window.location.href = "login.html";
}
// ================= ENGINE =================
function initEngine() {

if(engine) return;

engine = new Worker("stockfish.js");

    engine.postMessage("uci");
    engine.postMessage("isready");

    engine.addEventListener("message", function(event){

        const line = event.data;

        // ================= LIVE GAME ANALYSIS =================
        if(
            pendingLiveAnalysis &&
            line.includes("score cp")
        ){

            const scoreMatch =
            line.match(/score cp (-?\d+)/);

            if(scoreMatch){

                const score =
                parseInt(scoreMatch[1]);

                let review = "Good Move";

                if(score > 250)
                    review = "🔥 Brilliant";

                else if(score > 120)
                    review = "✨ Great Move";

                else if(score < -250)
                    review = "❌ Blunder";

                else if(score < -100)
                    review = "⚠ Mistake";

                const reviewEl =
                document.getElementById("liveReview");

                if(reviewEl){
                    reviewEl.innerHTML = review;
                }

                pendingLiveAnalysis = false;
            }
        }

        // ================= REVIEW ANALYSIS =================
        if(
            pendingReviewAnalysis &&
            line.includes("score cp")
        ){

            const scoreMatch =
            line.match(/score cp (-?\d+)/);

            if(!scoreMatch) return;

            const score =
            parseInt(scoreMatch[1]);

            let moveType = "Best Move";
            let color = "#22c55e";

            if(score < -300){
                moveType = "Blunder";
                color = "#ef4444";
            }
            else if(score < -120){
                moveType = "Mistake";
                color = "#f97316";
            }
            else if(score > 250){
                moveType = "Brilliant";
                color = "#06b6d4";
            }
            else if(score > 120){
                moveType = "Great Move";
                color = "#a855f7";
            }

            document.getElementById(
            "moveReview"
            ).innerHTML = `

            <div class="move-card">

                <h2>
                Move ${currentMoveIndex + 1}
                </h2>

                <div style="
                color:${color};
                font-size:28px;
                font-weight:700;
                margin-top:10px;
                ">
                ${moveType}
                </div>

                <p style="
                margin-top:20px;
                color:#aaa;
                ">
                Move Played:
                ${analysisMoves[currentMoveIndex]}
                </p>

                <p style="
                margin-top:10px;
                color:#aaa;
                ">
                Evaluation:
                ${score / 100}
                </p>

            </div>
            `;

            pendingReviewAnalysis = false;
        }
if(line.includes("bestmove")){

    engineBusy = false;

}
        // ================= AI MOVE =================
        if(
            pendingAIMove &&
            line.startsWith("bestmove")
        ){

            const move =
            line.split(" ")[1];

            if(
                move === "(none)" ||
                move.length < 4
            ) return;

            game.move({
                from: move.substring(0,2),
                to: move.substring(2,4),
                promotion:"q"
            });

            board.position(game.fen());

            checkGameStatus();

            pendingAIMove = false;
        }

    });
}

// ================= AI =================
function makeAIMove() {

    if (!engine || game.game_over())
    return;

    pendingAIMove = true;

    const level =
    aiSettings[aiLevel];

    engine.postMessage(
        "position fen " + game.fen()
    );

    engine.postMessage(
        `setoption name Skill Level value ${level.skill}`
    );

    engine.postMessage(
        `go depth ${level.depth}`
    );
}

// ================= GAME =================
let beginnerHints = false;

function toggleHints(){

    beginnerHints = !beginnerHints;

    const review =
    document.getElementById("liveReview");

    if(review){

        review.innerHTML = `

        <div id="beginnerCoach"
        class="coach-box">

        ${
            beginnerHints
            ? "💡 Beginner Coach Active"
            : "Hints OFF"
        }

        </div>

        AI Analysis Waiting...
        `;
    }
}

function updateBeginnerCoach(move){

const coach =
document.getElementById(
"beginnerCoach"
);

if(!coach) return;

if(move.piece === "p"){

coach.innerHTML =
"💡 Good pawn move. Control the center.";

}

else if(move.piece === "n"){

coach.innerHTML =
"✨ Nice! Knights are strong early.";

}

else if(move.piece === "q"){

coach.innerHTML =
"⚠ Be careful using the queen too early.";

}

else{

coach.innerHTML =
"♟ Keep developing your pieces.";
}
}

function onDrop(source, target) {
if(pendingAIMove)
return "snapback";

const piece =
game.get(source);

if(!piece)
return "snapback";

if(piece.color !== playerColor[0])
return "snapback";

if(game.turn() !== playerColor[0])
return "snapback";

    const move = game.move({
        from: source,
        to: target,
        promotion: "q"
    });

    if (move === null) return "snapback";

    gameMoves.push({
        move: move.san,
        playerEval: 0,
        bestEval: 0
    });

    board.position(game.fen());
updateBeginnerCoach(move);
currentAccuracy =
Math.floor(
70 + Math.random() * 30
);
    const pgn = game.pgn();

    if(pgn.includes("e4 e5 Nf3 Nc6 Bb5")){
        currentOpening = "Ruy Lopez";
    }

    engine.postMessage(
        "position fen " + game.fen()
    );

    pendingLiveAnalysis = true;
engine.postMessage("go depth 12");

    checkGameStatus();

    if (!game.game_over()) {
setTimeout(() => {

    makeAIMove();

}, 300);
    }
}

// ================= GAME STATUS =================
function checkGameStatus() {

    const el = document.getElementById("gameStatusValue");

    if (game.in_checkmate()) {
        const winner = game.turn() === "w" ? "Black" : "White";
        if (el) el.innerHTML = "🏆 " + winner + " wins!";
        board.draggable = false;
        setTimeout(() => {
            saveGame(winner);
        }, 500);
    }

    else if (game.in_draw()) {
        if (el) el.innerHTML = "🤝 Draw!";
        board.draggable = false;
        setTimeout(() => {
            saveGame("draw");
        }, 500);
    }

    if (el && !game.game_over()) {
        const turn = game.turn() === "w" ? "White" : "Black";
        el.innerHTML = `${turn}'s Turn`;
    }
}

// ================= SAVE GAME =================
function saveGame(result) {

    const token = localStorage.getItem("token");

    if (!token) {
        console.log("❌ No token, game not saved");
        showGameOverModal(result, "Unknown", "Unknown", 0);
        return;
    }

    fetch("https://queen-chess.onrender.com/api/game/save", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        },
      body: JSON.stringify({
    result,
    moves: game.history(),
    pgn: game.pgn(),
    playerColor,
    accuracy: currentAccuracy,
    opening: currentOpening
})

    })
    .then(res => {
        if (!res.ok) throw new Error("Save failed");
        return res.json();
    })
    .then(data => {
        console.log("Game saved ✅");
        currentGameId = data.game?._id || data._id || null;

        let duration = "0m 0s";
        if (gameStartTime) {
            const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            duration = mins + "m " + secs + "s";
        }

        showGameOverModal(result, game.history().length, currentAccuracy, duration);
    })
    .catch(err => {
        console.log("Save error ❌", err);
        showGameOverModal(result, game.history().length, currentAccuracy, "0m 0s");
    });
}

// ================= GAME OVER MODAL =================
function showGameOverModal(result, moveCount, accuracy, duration) {
    const isDraw = result === "draw";

    let winnerName, loserName;
    if (isDraw) {
        winnerName = "Draw";
        loserName = "Draw";
    } else {
        if (result === "White") {
            winnerName = playerColor === "white" ? "You" : "AI";
            loserName = playerColor === "white" ? "AI" : "You";
        } else {
            winnerName = playerColor === "black" ? "You" : "AI";
            loserName = playerColor === "black" ? "AI" : "You";
        }
    }

    const existingOverlay = document.querySelector('.modal-overlay');
    if (existingOverlay) existingOverlay.remove();

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';

    overlay.innerHTML = `
        <div class="game-over-modal">
            <div class="trophy-glow"></div>
            <div class="modal-trophy">
                ${isDraw ? "🤝" : "🏆"}
            </div>
            <div class="modal-title">
                ${isDraw ? "Game Drawn" : "Game Over"}
            </div>
            <div class="modal-subtitle">
                ${isDraw ? "A hard-fought battle!" : result + " wins!"}
            </div>

            <div class="modal-players">
                <div class="modal-player">
                    <div class="icon">${playerColor === "white" ? "🤍" : "🖤"}</div>
                    <div class="player-label">You</div>
                    <div class="player-name">Player (${playerColor})</div>
                </div>
                <div class="modal-vs">VS</div>
                <div class="modal-player">
                    <div class="icon">🤖</div>
                    <div class="player-label">AI</div>
                    <div class="player-name">Queen Chess AI</div>
                </div>
            </div>

            <div class="modal-results-grid">
                <div class="modal-result-item">
                    <div class="label">🏆 Winner</div>
                    <div class="value ${!isDraw && winnerName === 'You' ? 'winner' : ''}">${isDraw ? "—" : winnerName}</div>
                </div>
                <div class="modal-result-item">
                    <div class="label">❌ Loser</div>
                    <div class="value ${!isDraw && loserName === 'You' ? 'loser' : ''}">${isDraw ? "—" : loserName}</div>
                </div>
                <div class="modal-result-item">
                    <div class="label">♟ Moves</div>
                    <div class="value">${moveCount}</div>
                </div>
                <div class="modal-result-item">
                    <div class="label">🎯 Accuracy</div>
                    <div class="value">${accuracy}%</div>
                </div>
                <div class="modal-result-item">
                    <div class="label">⏱ Duration</div>
                    <div class="value">${duration}</div>
                </div>
                <div class="modal-result-item">
                    <div class="label">📋 Result</div>
                    <div class="value ${!isDraw && winnerName === 'You' ? 'winner' : ''}">${isDraw ? "Draw" : result}</div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="view-analysis-btn" onclick="viewGameAnalysis()">
                    📊 View Analysis
                </button>
                <button class="play-again-btn" onclick="playAgain()">
                    🔄 Play Again
                </button>
            </div>
        </div>
    `;

    document.body.appendChild(overlay);
    launchConfetti();
}

function launchConfetti() {
    const container = document.getElementById('confettiContainer');
    container.innerHTML = '';

    const colors = ['#a855f7', '#7c3aed', '#c084fc', '#9333ea', '#fbbf24', '#22c55e', '#06b6d4', '#ef4444'];
    const shapes = ['●', '■', '▲', '★', '♦'];

    for (let i = 0; i < 50; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.textContent = shapes[Math.floor(Math.random() * shapes.length)];
        piece.style.left = Math.random() * 100 + '%';
        piece.style.color = colors[Math.floor(Math.random() * colors.length)];
        piece.style.fontSize = (7 + Math.random() * 10) + 'px';
        piece.style.animationDuration = (2 + Math.random() * 2) + 's';
        piece.style.animationDelay = Math.random() * 0.4 + 's';
        container.appendChild(piece);
    }

    setTimeout(() => {
        container.innerHTML = '';
    }, 5000);
}

function viewGameAnalysis() {
    const overlay = document.querySelector('.modal-overlay');
    if (overlay) overlay.remove();

    if (currentGameId) {
        if (gameTimerInterval) clearInterval(gameTimerInterval);
        gameTimerInterval = null;
        window.location.href = "index.html?analyze=" + currentGameId;
    } else {
        alert("Game ID not available. Check your My Games list.");
        loadMatches();
    }
}

function playAgain() {
    const overlay = document.querySelector('.modal-overlay');
    if (overlay) overlay.remove();
    game = new Chess();
    currentGameId = null;
    loadPlay();
}

// ================= PLAY =================

let selectedColor = null;

function setColor(color) {
    playerColor = color;
    selectedColor = color;

    document.querySelectorAll('.color-row button').forEach(btn => {
        btn.classList.remove('selected');
    });
    const buttons = document.querySelectorAll('.color-row button');
    if (color === 'white' && buttons[0]) buttons[0].classList.add('selected');
    if (color === 'black' && buttons[1]) buttons[1].classList.add('selected');

    const el = document.getElementById("gameResult");
    if (el) el.innerHTML = "Selected: " + color;
}

function setRandomColor(){

    const random =
    Math.random() < 0.5
    ? "white"
    : "black";

    playerColor = random;
    selectedColor = random;

    document.querySelectorAll('.color-row button').forEach(btn => {
        btn.classList.remove('selected');
    });

    const el =
    document.getElementById("gameResult");

    if(el){
        el.innerHTML =
        "🎲 Random selected: " + random;
    }
}

function startGame() {
    const startCard = document.querySelector('.start-card');
    if (startCard) {
        startCard.classList.add('fade-out');
    }

    gameStartTime = Date.now();

    pendingAIMove = false;
    engineBusy = false;
    gameMoves = [];
    currentAccuracy = 0;
    currentOpening = "Unknown Opening";

    aiLevel =
    document.getElementById(
    "difficultySelect"
    ).value;
    game = new Chess();

    setTimeout(() => {
        showGameLayout();

        board = Chessboard('board', {
            draggable: true,
            position: "start",
            orientation: playerColor,
            onDrop: onDrop,
            onMouseoverSquare: showHints,
            onMouseoutSquare: removeHints
        });

        initEngine();

        if (playerColor === "black") {
        setTimeout(() => {
            makeAIMove();
        }, 500);
        }
    }, 400);
}

function showGameLayout() {
    const legalChecked = beginnerHints ? 'checked' : '';

    document.getElementById("content").innerHTML = `
        <div class="game-layout">
            <div class="game-left">
                <div id="board" class="fade-in"></div>
                <div class="game-controls-bar">
                    <button onclick="undoMove()" title="Undo last move">↩ Undo</button>
                    <button onclick="getHint()" title="Get a hint from AI">💡 Hint</button>
                    <button onclick="resignGame()" title="Resign the game">🏳 Resign</button>
                    <label class="legal-toggle">
                        <input type="checkbox" id="ingameLegalToggle" ${legalChecked} onchange="toggleInGameHints()">
                        Show Legal Moves
                    </label>
                </div>
                <div id="liveReview" class="live-review">
                    <div id="beginnerCoach" class="coach-box">💡 Beginner Coach Ready</div>
                    AI Analysis Waiting...
                </div>
            </div>
            <div class="game-right">
                <div class="game-info-panel">
                    <h3>Game Info</h3>
                    <div class="game-info-row-item">
                        <span class="label">🤍 White</span>
                        <span class="value timer" id="whiteTimer">00:00</span>
                    </div>
                    <div class="game-info-row-item">
                        <span class="label">🖤 Black</span>
                        <span class="value timer" id="blackTimer">00:00</span>
                    </div>
                    <div class="game-info-row-item">
                        <span class="label">🎯 Difficulty</span>
                        <span class="value">${aiLevel.charAt(0).toUpperCase() + aiLevel.slice(1)}</span>
                    </div>
                    <div class="game-info-row-item">
                        <span class="label">♟ Moves</span>
                        <span class="value" id="moveCount">0</span>
                    </div>
                    <div class="game-info-row-item">
                        <span class="label">📊 Status</span>
                        <span class="status-badge" id="gameStatusValue">${playerColor}'s Turn</span>
                    </div>
                    <div class="game-info-row-item">
                        <span class="label">🎯 Accuracy</span>
                        <span class="value" id="accuracyDisplay">0%</span>
                    </div>
                </div>
            </div>
        </div>
    `;

    startGameTimer();
}

function startGameTimer() {
    if (gameTimerInterval) clearInterval(gameTimerInterval);

    const startTime = Date.now();
    gameTimerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const secs = String(elapsed % 60).padStart(2, '0');
        const timeStr = mins + ':' + secs;

        const whiteTimer = document.getElementById('whiteTimer');
        const blackTimer = document.getElementById('blackTimer');
        if (whiteTimer) whiteTimer.textContent = timeStr;
        if (blackTimer) blackTimer.textContent = timeStr;
    }, 1000);
}

function toggleInGameHints() {
    const cb = document.getElementById('ingameLegalToggle');
    if (cb) {
        beginnerHints = cb.checked;
        const coach = document.getElementById('beginnerCoach');
        if (coach) {
            coach.innerHTML = beginnerHints ? "💡 Beginner Coach Active" : "Hints OFF";
        }
    }
}

function undoMove() {
    if (game.history().length >= 2) {
        game.undo();
        game.undo();
        board.position(game.fen());
    } else if (game.history().length === 1) {
        game.undo();
        board.position(game.fen());
    }
    updateMoveCount();
}

function getHint() {
    if (!engine) return;
    engine.postMessage("stop");
    setTimeout(() => {
        engine.postMessage("position fen " + game.fen());
        engine.postMessage("go depth 10");
        const coach = document.getElementById('beginnerCoach');
        if (coach) coach.innerHTML = "💡 Analyzing best move...";
        const hintHandler = function(event) {
            const line = event.data;
            if (line.startsWith("bestmove")) {
                const move = line.split(" ")[1];
                if (move && move.length >= 4) {
                    const coach = document.getElementById('beginnerCoach');
                    if (coach) coach.innerHTML = "💡 Hint: Try " + move.substring(0,2) + " → " + move.substring(2,4);
                }
                engine.removeEventListener("message", hintHandler);
            }
        };
        engine.addEventListener("message", hintHandler);
    }, 100);
}

function resignGame() {
    if (game.game_over()) return;
    if (confirm("Are you sure you want to resign?")) {
        const winner = playerColor === "white" ? "Black" : "White";
        board.draggable = false;
        const statusEl = document.getElementById("gameStatusValue");
        if (statusEl) statusEl.innerHTML = "🏳 " + winner + " wins (resignation)";
        const result = winner;
        game = new Chess();
        saveGame(result);
    }
}

function updateMoveCount() {
    const el = document.getElementById('moveCount');
    if (el) el.textContent = game.history().length;
}

function showHints(square){
    if(!beginnerHints) return;
    const moves = game.moves({square, verbose:true});
    moves.forEach(move => {
        const el = document.querySelector(`.square-${move.to}`);
        if(el) el.style.boxShadow = "inset 0 0 0 4px #a855f7";
    });
}

function removeHints(){
    document.querySelectorAll('[class*="square-"]').forEach(el => {
        el.style.boxShadow = "";
    });
}

function loadPlay() {
    if (gameTimerInterval) clearInterval(gameTimerInterval);
    gameTimerInterval = null;
    gameStartTime = null;

    const selectedWhite = selectedColor === 'white' ? 'selected' : '';
    const selectedBlack = selectedColor === 'black' ? 'selected' : '';

    document.getElementById("content").innerHTML = `
    <div class="start-screen-wrapper">
        <div class="start-card">
            <span class="start-card-icon">♛</span>
            <h2>Start Match</h2>
            <p class="sub-text">Choose your side, difficulty, and begin.</p>

            <div class="color-row">
                <button class="${selectedWhite}" onclick="setColor('white')">🤍 White</button>
                <button class="${selectedBlack}" onclick="setColor('black')">🖤 Black</button>
            </div>

            <button class="full-btn" onclick="setRandomColor()">🎲 Random Side</button>

            <div>
                <p class="difficulty-label">AI Difficulty</p>
                <select id="difficultySelect">
                    <option value="beginner">Beginner</option>
                    <option value="intermediate" selected>Intermediate</option>
                    <option value="advanced">Advanced</option>
                    <option value="master">Master</option>
                </select>
            </div>

            <label class="hint-toggle">
                <input type="checkbox" onchange="toggleHints()">
                Show Legal Moves
            </label>

            <button class="start-btn" onclick="startGame()">▶ Start Match</button>

            <div id="gameResult"></div>
            <div id="liveReview" class="live-review">
                <div id="beginnerCoach" class="coach-box">💡 Beginner Coach Ready</div>
                AI Analysis Waiting...
            </div>
        </div>
    </div>
    `;
}

// ================= MY GAMES =================
function loadMatches() {

    const token = localStorage.getItem("token");

    if (!token) {
        document.getElementById("content").innerHTML = `
        <div class="analysis-card">
            <h2>⚠️ Login Required</h2>
            <button onclick="goToLogin()">Login</button>
        </div>
        `;
        return;
    }

    fetch("https://queen-chess.onrender.com/api/game/my-games", {
        headers: { "Authorization": `Bearer ${token}` }
    })
    .then(res => res.json())
    .then(data => {
        if (!data || data.length === 0) {
            document.getElementById("content").innerHTML = `
            <div class="analysis-card">
                <h2>No Games Yet 😢</h2>
                <p style="color:#aaa;">Play your first match to see history.</p>
            </div>
            `;
            return;
        }

        let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <div>
                <h2>♟ My Games</h2>
                <p style="color:#999;">Recent matches and analysis</p>
            </div>
        </div>
        <div class="games-container">
        `;

        data.forEach(g => {
            html += `
            <div class="game-card">
                <div class="game-header">
                    <div class="result">${g.result || "Unknown"}</div>
                    <div class="date">${new Date(g.createdAt).toLocaleDateString()}</div>
                </div>
                <div class="game-body">
                    ♟ Moves: ${g.moves?.length || 0}<br><br>
                    🎯 Accuracy: ${g.accuracy || 0}%
                </div>
                <div class="game-actions">
                    <button onclick="analyzeGame('${g._id}')">🔍 Analyze</button>
                </div>
            </div>
            `;
        });

        html += `</div>`;
        document.getElementById("content").innerHTML = html;
    });
}

async function analyzeGame(gameId){

const token = localStorage.getItem("token");

const response = await fetch(
"https://queen-chess.onrender.com/api/game/my-games",
{ headers: { Authorization: `Bearer ${token}` } }
);

const games = await response.json();
const gameData = games.find(g => g._id === gameId);

if(!gameData){
    alert("Game not found");
    return;
}

document.getElementById("content").innerHTML = `
<div class="analysis-layout">
    <div class="analysis-left">
        <div style="display:flex; gap:10px; align-items:center; width:400px; max-width:42vw;">
            <button class="back-btn" onclick="loadMatches()">← Back</button>
            <span style="font-size:14px;color:#999;">Reviewing ${gameData.playerColor}'s game</span>
        </div>
        <div id="analysisBoard"></div>
        <div class="move-buttons">
            <button onclick="previousMove()">← Previous</button>
            <button onclick="nextMove()">Next →</button>
        </div>
    </div>

    <div class="analysis-right">
        <div class="review-card">
            <h1>♟ Game Review</h1>
            <div class="stat">
                <span>🎯 Accuracy</span>
                <span>${gameData.accuracy || 0}%</span>
            </div>
            <div class="stat">
                <span>♟ Moves</span>
                <span>${gameData.moves?.length || 0}</span>
            </div>
            <div class="stat">
                <span>🏆 Result</span>
                <span>${gameData.result || "Unknown"}</span>
            </div>
            <div class="stat">
                <span>📖 Opening</span>
                <span>${gameData.opening || "Unknown"}</span>
            </div>

            <div id="moveReview" class="move-review-content" style="margin-top:12px;">
                <h3 style="color:#aaa;font-size:13px;">Current Move</h3>
                <p style="color:#666;font-size:12px;">Click Next to begin reviewing</p>
            </div>
        </div>

        <div class="moves-box">
            <h2 class="moves-title">Game Moves</h2>
            <div id="movesList"></div>
        </div>
    </div>
</div>
`;

analysisGame = new Chess();
if(!engine) initEngine();
analysisMoves = gameData.moves || [];
renderMovesList();
currentMoveIndex = -1;

analysisBoard = Chessboard("analysisBoard",{
    position:"start",
    draggable:false,
    orientation: gameData.playerColor === "black" ? "black" : "white"
});

if(gameData.playerColor === "black"){
    analysisBoard.orientation("black");
}
}

// ================= REVIEW MOVES =================

function nextMove() {
    if (currentMoveIndex >= analysisMoves.length - 1) return;
    currentMoveIndex++;
    analysisGame.move(analysisMoves[currentMoveIndex]);
    analysisBoard.position(analysisGame.fen());
    renderMovesList();
    analyzeCurrentMove();
}

function previousMove() {
    if (currentMoveIndex < 0) return;
    analysisGame.undo();
    analysisBoard.position(analysisGame.fen());
    currentMoveIndex--;
    renderMovesList();
    analyzeCurrentMove();
}

function analyzeCurrentMove() {
    if(currentMoveIndex < 0) return;
    if(!engine) return;
    if(engineBusy) return;

    engineBusy = true;
    engine.postMessage("stop");

    setTimeout(() => {
        engine.postMessage("position fen " + analysisGame.fen());
        pendingReviewAnalysis = true;
        engine.postMessage("go depth 12");
    }, 100);
}

function renderMovesList(){
    let html = "";
    analysisMoves.forEach((move,index)=>{
        const active = index === currentMoveIndex ? "active-move" : "";
        html += `<button class="move-btn ${active}" onclick="jumpToMove(${index})">${index + 1}. ${move}</button>`;
    });
    document.getElementById("movesList").innerHTML = html;
}

function jumpToMove(index){
    analysisGame = new Chess();
    for(let i = 0; i <= index; i++){
        analysisGame.move(analysisMoves[i]);
    }
    currentMoveIndex = index;
    analysisBoard.position(analysisGame.fen());
    renderMovesList();
    analyzeCurrentMove();
}

// ================= URL PARAMETER HANDLING =================
function checkUrlParams() {
    const params = new URLSearchParams(window.location.search);
    const analyzeId = params.get('analyze');
    if (analyzeId) {
        window.history.replaceState({}, '', window.location.pathname);
        setTimeout(() => {
            analyzeGame(analyzeId);
        }, 100);
        return true;
    }
    return false;
}

// ================= INIT =================
renderSidebar();

if (!checkUrlParams()) {
    loadHome();
}
</script>
