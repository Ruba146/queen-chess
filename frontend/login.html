<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">

<div class="auth-background">
  <div class="auth-glow auth-glow-1"></div>
  <div class="auth-glow auth-glow-2"></div>
  <div class="auth-queen">♛</div>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">♛</div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your Queen Chess account</p>
    </div>

    <form id="loginForm" class="auth-form">
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="auth-submit">Sign In</button>
    </form>

    <p id="message" class="auth-message"></p>

    <p class="auth-alt">
      Don't have an account?
      <a href="register.html">Create one</a>
    </p>
  </div>
</div>

<script src="js/login.js"></script>

</body>
</html>
