<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">

<div class="auth-background">
  <div class="auth-glow auth-glow-1"></div>
  <div class="auth-glow auth-glow-2"></div>
  <div class="auth-queen">♛</div>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">♛</div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Start your chess journey with Queen Chess</p>
    </div>

    <form id="registerForm" class="auth-form">
      <div class="auth-field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Your username" required />
      </div>
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required />
      </div>
      <div class="auth-field">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter your password" required />
      </div>
      <button type="submit" class="auth-submit">Create Account</button>
    </form>

    <p id="message" class="auth-message"></p>

    <p class="auth-alt">
      Already have an account?
      <a href="login.html">Sign in</a>
    </p>
  </div>
</div>

<script src="js/register.js"></script>

</body>
</html>
